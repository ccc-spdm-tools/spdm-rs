[package]
name = "spdmlib_crypto_aws_lc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 or MIT"

[dependencies]
spdmlib = { path = "../spdmlib", default-features = false }
spdm_x509 = { path = "../spdmlib/src/crypto/spdm_x509", default-features = false }
# alloc (not std) so the backend builds for no_std targets such as x86_64-unknown-none.
aws-lc-rs = { path = "../external/aws-lc-rs/aws-lc-rs", default-features = false, features = [
    "aws-lc-sys",
    "alloc",
    "ring-sig-verify",
    "ml-kem",
    "ml-dsa",
    "small",
    "unstable",
] }
aws-lc-sys = { path = "../external/aws-lc-rs/aws-lc-sys", default-features = false }
log = { version = "0.4", default-features = false }
# For the streaming hash-context handle table (hashed-transcript-data).
lazy_static = { version = "1.0", features = ["spin_no_std"] }
spin = "0.9.8"
# For building SpdmDheExchangeStruct via its From<BytesMut> impl.
bytes = { version = "1", default-features = false }
zeroize = { version = "1.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
spdmlib = { path = "../spdmlib", default-features = false, features = ["fips"] }
# std so the cert-chain tests can read test-key DER files. No ring-backend: the
# tests drive validation through AwsLcBackend (classical + ML-DSA).
spdm_x509 = { path = "../spdmlib/src/crypto/spdm_x509", default-features = false, features = ["std"] }

[features]
default = []
hashed-transcript-data = ["spdmlib/hashed-transcript-data"]
chacha20-poly1305 = []
fips = ["spdmlib/fips"]
