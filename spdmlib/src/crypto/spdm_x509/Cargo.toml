[package]
name = "spdm_x509"
version = "0.1.0"
edition = "2021"
authors = [
    "Mariusz Galan <stanislaw.grams@intel.com>",
    "Stanislaw Grams <stanislaw.grams@intel.com>"
    ]
license = "Apache-2.0 or MIT"
description = "X.509 certificate parsing and validation with SPDM extensions and multi-backend support"

[dependencies]
# ASN.1/DER encoding and decoding
der = { version = "0.7", default-features = false, features = ["alloc", "derive", "oid"] }
spki = { version = "0.7", default-features = false, features = ["alloc"] }
const-oid = { version = "0.9", default-features = false }
focaccia = "2.0"
unicode-normalization = { version = "0.1", default-features = false }

# PEM encoding support
pem-rfc7468 = { version = "0.7", default-features = false, features = ["alloc"] }

# base64ct 1.7+ may require edition2024; allow patch updates within 1.6.x
base64ct = "~1.6"

# Safe no_std one-time global for the pluggable PQC (ML-DSA) verifier hook
conquer-once = { version = "0.3.2", default-features = false }

# Logging
log = { version = "0.4", default-features = false }

[dev-dependencies]
# For testing
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Test-only crypto backend: `ring` powers the bundled RingBackend, which is gated
# on `cfg(test)`, so it exists only in this crate's own test builds and can never
# be linked into a production build. Production consumers supply their own
# `CryptoBackend`.
ring = { version = "0.17", default-features = false, features = ["alloc", "std"] }
untrusted = "0.9"

[features]
default = []
std = ["der/std", "log/std", "conquer-once/std"]
alloc = ["der/alloc"]
fuzzing = []

[lib]
name = "spdm_x509"
path = "src/lib.rs"
