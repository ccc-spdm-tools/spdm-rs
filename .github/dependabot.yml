version: 2
updates:

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      # Check for updates to cargo dependencies every week
      interval: "weekly"
    open-pull-requests-limit: 1
    allow:
    - dependency-type: direct
    - dependency-type: indirect

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    # Group all GitHub Actions bumps into a single PR per run so that
    # sub-actions of the same repo (e.g. github/codeql-action/init,
    # /analyze, /autobuild) are updated together, avoiding redundant PRs,
    # merge conflicts, and version drift between them.
    groups:
      github-actions:
        patterns:
          - "*"
