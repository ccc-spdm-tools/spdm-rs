# This is a basic workflow to help you get started with Actions

name: RUN CODE

env:
  RUST_TOOLCHAIN: 1.93.0
  TOOLCHAIN_PROFILE: minimal

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  aws-lc-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "14.0"
          directory: ${{ runner.temp }}/llvm

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          profile: ${{ env.TOOLCHAIN_PROFILE }}
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          components: clippy

      - name: Prepare dependencies
        run: ./sh_script/pre-build.sh

      - name: Check AWS-LC profiles
        shell: bash
        run: |
          cargo test -p spdmlib_crypto_aws_lc -- --test-threads=1
          cargo clippy -p spdmlib_crypto_aws_lc --all-targets --no-default-features -- -D warnings

          classical_features="hashed-transcript-data,sha256,sha384,aes-256-gcm,ecdsa-p256,ecdsa-p384,rsa-pkcs1,ecdh-p256,ecdh-p384"
          cargo test -p spdmlib_crypto_aws_lc --no-default-features --features="${classical_features}" -- --test-threads=1
          cargo clippy -p spdmlib_crypto_aws_lc --all-targets --no-default-features --features="${classical_features}" -- -D warnings

          selected_features="small,hashed-transcript-data,sha256,sha384,aes-256-gcm,ecdsa-p256,ecdsa-p384,rsa-pkcs1,ecdh-p256,ecdh-p384,ml-dsa-87,ml-kem-1024"
          cargo test -p spdmlib_crypto_aws_lc --no-default-features --features="${selected_features}" -- --test-threads=1
          cargo clippy -p spdmlib_crypto_aws_lc --all-targets --no-default-features --features="${selected_features}" -- -D warnings

  # This workflow contains a single job called "build"
  build:
    strategy:
      matrix:
        runs-on: [ubuntu-latest]
        run_requester_features:
          [
            "spdm-ring,async-executor",
            "spdm-ring,hashed-transcript-data,async-executor",
            "spdm-mbedtls,async-executor",
            "spdm-mbedtls,hashed-transcript-data,async-executor",
            "spdm-ring,hashed-transcript-data,is_sync",
            "spdm-ring,is_sync",
          ]
        run_responder_features:
          [
            "spdm-ring,async-executor",
            "spdm-ring,hashed-transcript-data,async-executor",
            "spdm-mbedtls,async-executor",
            "spdm-mbedtls,hashed-transcript-data,async-executor",
            "spdm-ring,hashed-transcript-data,is_sync",
            "spdm-ring,is_sync",
          ]
        include:
          - runs-on: windows-latest
            run_requester_features: "spdm-ring,hashed-transcript-data,async-executor"
            run_responder_features: "spdm-ring,hashed-transcript-data,async-executor"
          - runs-on: ubuntu-latest
            run_requester_features: "spdm-ring,hashed-transcript-data,async-executor,spdm-aws-lc"
            run_responder_features: "spdm-ring,hashed-transcript-data,async-executor,spdm-aws-lc"
          # mbedtls + aws-lc overlay: mbedtls for classical, aws-lc for PQC.
          - runs-on: ubuntu-latest
            run_requester_features: "spdm-mbedtls,hashed-transcript-data,async-executor,spdm-aws-lc"
            run_responder_features: "spdm-mbedtls,hashed-transcript-data,async-executor,spdm-aws-lc"
          # Standalone aws-lc: aws-lc-rs alone (no ring, no mbedtls), std-only.
          - runs-on: ubuntu-latest
            run_requester_features: "spdm-aws-lc,hashed-transcript-data,async-executor"
            run_responder_features: "spdm-aws-lc,hashed-transcript-data,async-executor"
    # The type of runner that the job will run on
    runs-on: ${{ matrix.runs-on }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "14.0"
          directory: ${{ runner.temp }}/llvm

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          profile: ${{ env.TOOLCHAIN_PROFILE }}
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          components: rust-src, rustfmt, clippy

      - name: Add `x86_64-unknown-none` target
        run: rustup target add x86_64-unknown-none

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build and Run test
        shell: bash
        env:
          CC_x86_64_unknown_none: clang
          AR_x86_64_unknown_none: llvm-ar
        run: |
          ./sh_script/build.sh -c
          ./sh_script/build.sh

      - name: Requester-Responder test
        shell: bash
        env:
          CC_x86_64_unknown_none: clang
          AR_x86_64_unknown_none: llvm-ar
          RUN_REQUESTER_FEATURES: ${{ matrix.run_requester_features }}
          RUN_RESPONDER_FEATURES: ${{ matrix.run_responder_features }}
        run: |
          ./sh_script/build.sh -r

      - name: Rollback test
        shell: bash
        env:
          CC_x86_64_unknown_none: clang
          AR_x86_64_unknown_none: llvm-ar
        run: |
          ./sh_script/rollbacktest.sh -a
