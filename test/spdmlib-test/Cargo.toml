[package]
name = "spdmlib-test"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
spdmlib = { path = "../../spdmlib", default-features = false, features=["spdm-ring"] }
codec = { path = "../../codec", features = ["alloc"] }
log = "0.4.13"
ring = { version = "0.17.14" }
bytes = { version="1", default-features=false }
futures = { version = "0.3", default-features = false }
async-trait = "0.1.71"
async-recursion = "1.0.4"
spin = { version = "0.9.8" }
executor = { path = "../../executor" }
pcidoe_transport = { path = "../../pcidoe_transport" }
spdmlib_crypto_aws_lc = { path = "../../spdmlib_crypto_aws_lc", optional = true }
aws-lc-rs = { path = "../../external/aws-lc-rs/aws-lc-rs", features = ["unstable"], optional = true }

[dev-dependencies]
env_logger = "*"

[features]
default = ["hashed-transcript-data", "mut-auth", "chunk-cap", "respond-if-ready"]
hashed-transcript-data = ["spdmlib/hashed-transcript-data", "spdmlib_crypto_aws_lc?/hashed-transcript-data"]
mut-auth = ["spdmlib/mut-auth"]
chunk-cap = ["spdmlib/chunk-cap"]
respond-if-ready = ["spdmlib/respond-if-ready"]
fips = ["spdmlib/fips"]
# The ML-KEM and the ML-DSA certificate chain verification that SPDMRS_USE_PQC=true needs: the
# real ones, as the DHE and the certificate chain verification of the classical suites are.
spdm-aws-lc = ["spdmlib_crypto_aws_lc", "aws-lc-rs", "spdmlib/std"]
