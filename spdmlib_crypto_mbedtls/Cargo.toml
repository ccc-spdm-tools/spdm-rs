[package]
name = "spdmlib_crypto_mbedtls"
version = "0.1.0"
edition = "2018"
license = "Apache-2.0 or MIT"

[dependencies]
spdmlib = { path = "../spdmlib", default-features = false}
# spdm_x509 provides ML-DSA (FIPS 204) aware certificate-chain validation via
# its pluggable crypto backend plus the runtime PQC verifier hook. Use the
# mbedtls backend so classical (RSA/ECC) certificate signatures are verified by
# mbedtls and no ring is linked; post-quantum signatures still dispatch to the
# registered PQC verifier hook, so PQC certificate chains keep working.
spdm_x509 = { path = "../spdmlib/src/crypto/spdm_x509", default-features = false, features = ["mbedtls-backend"] }
lazy_static = { version = "1.0", features = ["spin_no_std"] }
spin = "0.9.8"
zeroize = { version = "1.5.0", features = ["zeroize_derive"]}
mbedtls = { version = "0.9.1", default-features = false, features = ["no_std_deps", "rdrand"]}
mbedtls-sys-auto = { version = "2.28.0", default-features = false }

[dev-dependencies]
spdmlib = { path = "../spdmlib", default-features = false, features = ["fips"] }

[features]
default = ["full", "hashed-transcript-data", "std"]
full = [
	"sha256",
	"sha384",
	"aes-256-gcm",
	"ecdsa-p256",
	"ecdsa-p384",
	"rsa-pkcs1",
	"ecdh-p256",
	"ecdh-p384",
]
hashed-transcript-data = ["spdmlib/hashed-transcript-data"]
std = []
sha256 = ["spdmlib/sha256"]
sha384 = ["spdmlib/sha384"]
aes-256-gcm = ["spdmlib/aes-256-gcm"]
ecdsa-p256 = ["spdmlib/ecdsa-p256"]
ecdsa-p384 = ["spdmlib/ecdsa-p384"]
rsa-pkcs1 = ["spdmlib/rsa-pkcs1"]
ecdh-p256 = ["spdmlib/ecdh-p256"]
ecdh-p384 = ["spdmlib/ecdh-p384"]
